<!-- Мягкий CSP: безопасен, не ломает приложение (блокирует только object/embed,
     подмену base и встраивание в чужой iframe). -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; frame-ancestors 'none'"/>
<!-- СТРОГИЙ CSP (включить после проверки входа через Google; 'unsafe-eval' нужен
     только пока JSX компилируется Babel в браузере — после перехода на сборку
     esbuild/Vite его можно убрать):
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://content.googleapis.com; object-src 'none'; base-uri 'self'"/>
-->

<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="./icon-192.png"/>

<!-- SRI: crossorigin добавлен, чтобы можно было включить проверку целостности.
     Чтобы защититься от подмены CDN, добавьте integrity="sha384-…" в каждый тег.
     Хеш берётся так (при наличии интернета):
       curl -s https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js | openssl dgst -sha384 -binary | openssl base64 -A
     Хеши намеренно НЕ вписаны: неверный хеш заблокирует скрипт и сломает приложение. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  /* Light palette — Hermès-inspired warm neutrals with deep navy accent */

  --surface: #FFFFFF;
  --surface2: #FAF9F7;

  --topbar: rgba(255,255,255,0.82);

  --t2: #636366;
  --t3: #AEAEB2;
  --border: rgba(0,0,0,0.06);
  --border2: rgba(0,0,0,0.04);
  --accent: #2C5EE8;
  --accent2: #5B5BD6;
  --gold: #C9A84C;
  --green: #2A9D5C;
  --red: #D63A3A;
  --amber: #C47C00;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);

  --radius: 14px;

  --radius-xs: 6px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body.dark {
  --bg: #0F0F10;
  --surface: #1C1C1E;
  --surface2: #2C2C2E;
  --sidebar-bg: #000000;
  --topbar: rgba(28,28,30,0.88);
  --text: #F5F5F7;
  --t2: #AEAEB2;
  --t3: #636366;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.25);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  --modal-bg: rgba(0,0,0,0.72);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.2s ease, color 0.2s ease;
}

/* Scrollbars */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--t3); }

input, select, button, textarea { font-family: var(--font); color: var(--text); }
a { color: var(--accent); text-decoration: none; }

/* Calendar event micro-interactions */
.cal-ev {
  transition: opacity 0.1s ease, transform 0.1s ease, box-shadow 0.15s ease;
  will-change: transform;
}
.cal-ev:hover {
  opacity: 0.92 !important;
  transform: scale(1.01);
  z-index: 20 !important;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18) !important;
}

.cal-cell { transition: background 0.08s ease; }
.cal-cell:hover { background: var(--surface2) !important; }

/* Nav item transitions */
.nav-item { transition: background 0.12s ease, color 0.12s ease; }
.nav-item:hover { background: rgba(255,255,255,0.07) !important; }

/* Card hover */
.card-hover {
  transition: box-shadow 0.18s ease, transform 0.18s ease;
}
.card-hover:hover {
  box-shadow: var(--shadow-lg) !important;
  transform: translateY(-1px);
}

/* Stat card pulse on load */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-fade-up { animation: fadeUp 0.35s ease both; }

/* Ring animation */
@keyframes ringDraw {
  from { stroke-dasharray: 0 999; }
}
.ring-path { animation: ringDraw 1s cubic-bezier(0.4,0,0.2,1) both 0.2s; }

/* Line chart animation */
@keyframes lineDraw {
  from { stroke-dashoffset: 1000; }
  to { stroke-dashoffset: 0; }
}
.line-path { stroke-dasharray: 1000; animation: lineDraw 1.2s cubic-bezier(0.4,0,0.2,1) both 0.3s; }

/* Toggle switch */
.toggle-wrap { position: relative; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.toggle-track {
  width: 36px; height: 20px; border-radius: 99px;
  background: var(--t3); transition: background 0.2s;
  position: relative; flex-shrink: 0;
}
.toggle-track.on { background: var(--accent); }
.toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  transition: left 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.toggle-thumb.on { left: 18px; }

/* Tooltip */
.tooltip-wrap { position: relative; }
.tooltip-wrap .tooltip-body {
  display: none; position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%); background: var(--text); color: var(--surface);
  font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 6px;
  white-space: nowrap; pointer-events: none; z-index: 999;
}
.tooltip-wrap:hover .tooltip-body { display: block; }

/* Page enter animation */
@keyframes pgIn {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
.pg-enter { animation: pgIn 0.25s cubic-bezier(0.22,1,0.36,1) both; }

/* Pulse dot */
@keyframes pdot { 0%,100%{opacity:1} 50%{opacity:0.35} }
.pulse-dot { animation: pdot 1.5s ease-in-out infinite; }

/* ── MOBILE RESPONSIVE ─────────────────────────────────────── */
/* Bottom nav (mobile only) */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
  background: var(--sidebar-bg);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 6px 0 max(6px, env(safe-area-inset-bottom));
}
/* Bottom sheet */
@keyframes sheetUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.bottom-sheet {
  animation: sheetUp 0.3s cubic-bezier(0.22,1,0.36,1) both;
  border-radius: 20px 20px 0 0 !important;
  max-height: 92vh !important;
  overflow-y: auto !important;
  width: 100% !important;
  max-width: 100% !important;
}
/* Mobile: hide sidebar, show bottom nav */
@media (max-width: 768px) {
  .desktop-sidebar { display: none !important; }
  .desktop-topbar  { display: none !important; }
  .bottom-nav      { display: flex !important; }
  .mobile-page     { padding: 12px 14px 80px !important; }
  .mobile-header   { display: flex !important; }
  .desktop-only    { display: none !important; }
}
/* Tablet */
@media (min-width: 769px) {
  .bottom-nav      { display: none !important; }
  .mobile-header   { display: none !important; }
}
/* Mobile cards full width */
@media (max-width: 480px) {
  .grid-cols-auto { grid-template-columns: 1fr !important; }
  .grid-cols-2    { grid-template-columns: 1fr !important; }
  .grid-cols-3    { grid-template-columns: 1fr !important; }
  .grid-cols-4    { grid-template-columns: 1fr 1fr !important; }
}
/* Touch-friendly tap targets */
@media (max-width: 768px) {
  button { min-height: 38px; }
  input, select, textarea { font-size: 16px !important; } /* prevent zoom on iOS */
}

/* Кнопка «Установить приложение» */
#installBtn {
  display:none;position:fixed;bottom:18px;right:18px;z-index:9999;
  background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;border:none;
  border-radius:99px;padding:11px 18px;font-size:13px;font-weight:700;
  font-family:'Inter',sans-serif;box-shadow:0 6px 24px rgba(37,99,235,.4);
  cursor:pointer;align-items:center;gap:7px;
}
#installBtn.show{display:flex;}
@media (max-width: 768px) {
  #installBtn{ bottom: calc(env(safe-area-inset-bottom,0px) + 74px); right:14px; padding:10px 15px; font-size:12px; }
}
</style>

<body>
<div id="root"></div>
<button id="installBtn" onclick="triggerInstall()" aria-label="Установить приложение на устройство">
  <span style="font-size:15px">⤓</span> Установить приложение
</button>
<div id="errbox" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;padding:16px;font-family:monospace;font-size:13px;z-index:99999;white-space:pre-wrap;max-height:50vh;overflow:auto"></div>
<script>
/* Установка PWA. На Android/desktop Chrome браузер сам присылает событие
   beforeinstallprompt — ловим его, показываем кнопку, по клику вызываем prompt().
   На iOS Safari такого события не бывает вообще (это ограничение iOS, а не баг) —
   там показываем короткую инструкцию «Поделиться → На экран Домой». */
var deferredInstallPrompt = null;
function fhqIsStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function fhqIsIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function fhqShowInstallBtn(){ var b=document.getElementById("installBtn"); if(b) b.classList.add("show"); }
function fhqHideInstallBtn(){ var b=document.getElementById("installBtn"); if(b) b.classList.remove("show"); }
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!fhqIsStandalone()) fhqShowInstallBtn();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  fhqHideInstallBtn();
});
function triggerInstall(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt=null; fhqHideInstallBtn(); });
    return;
  }
  if(fhqIsIOS()){
    alert("Установка на iPhone/iPad:\n\n1. Нажмите «Поделиться» (значок со стрелкой вверх) внизу экрана Safari\n2. Выберите «На экран «Домой»»\n3. Нажмите «Добавить»");
    return;
  }
  alert("Установка сейчас недоступна в этом браузере.\nОткройте сайт в Chrome (Android) или Safari (iPhone/iPad) и повторите попытку.");
}
document.addEventListener("DOMContentLoaded", function(){
  if(fhqIsStandalone()) return; // уже установлено — кнопку не показываем
  if(fhqIsIOS()) fhqShowInstallBtn(); // на iOS событие не придёт — показываем сразу, кнопка даст инструкцию
});
</script>
<script>
/* Ошибки: копим в буфер (нужно для диагностики на телефоне, где нет консоли) и
   показываем компактную плашку внизу — её можно закрыть. Это НЕ прежний красный
   баннер во весь экран: он появляется только при реальной ошибке и не мешает работе.
   Реальные краши рендера ловит ErrorBoundary и показывает дружелюбный экран. */
window.__fhqErrors = [];
function fhqLogErr(kind, msg, extra){
  try{
    window.__fhqErrors.push({kind:kind, msg:String(msg||""), extra:String(extra||""), at:new Date().toISOString()});
    if(window.__fhqErrors.length>20) window.__fhqErrors.shift();
    console.error(kind+":", msg, extra||"");
    fhqShowErrToast(String(msg||"неизвестная ошибка"));
  }catch(_){}
}
function fhqShowErrToast(msg){
  try{
    if(localStorage.getItem("fhq_hide_err")==="1") return;
    var box=document.getElementById("fhq-err-toast");
    if(!box){
      box=document.createElement("div");
      box.id="fhq-err-toast";
      box.style.cssText="position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:100000;background:#7F1D1D;color:#fff;border-radius:10px;padding:9px 12px;font:12px/1.4 'Inter',-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:flex-start";
      document.body.appendChild(box);
    }
    box.innerHTML='<div style="flex:1;word-break:break-word"><b>Ошибка</b><br>'+
      String(msg).replace(/[<>&]/g,"")+'</div>'+
      '<button id="fhq-err-x" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer">×</button>';
    var x=document.getElementById("fhq-err-x");
    if(x) x.onclick=function(){ box.remove(); };
  }catch(_){}
}
window.addEventListener("error",function(e){
  fhqLogErr("Ошибка", e.message, (e.filename?(e.filename+":"+e.lineno):""));
});
window.addEventListener("unhandledrejection",function(e){
  var r=e.reason; fhqLogErr("Сбой запроса", (r&&r.message)||r, "");
});

/* Сторож белого экрана: если через 8 секунд в приложении так и не появилось
   содержимое — показываем аварийный экран с причиной и вариантами восстановления.
   Данные при этом не трогаются. */
(function(){
  function boot(){
    setTimeout(function(){
      var root=document.getElementById("root");
      if(root && root.children.length>0) return; // всё отрисовалось — сторож не нужен
      var errs=(window.__fhqErrors||[]).map(function(x){return x.kind+": "+x.msg+(x.extra?(" ("+x.extra+")"):"");}).join("\n") || "Приложение не запустилось, но ошибок не зафиксировано. Чаще всего помогает «Обновить приложение» — старая версия могла остаться в кэше телефона.";
      var safe=localStorage.getItem("fhq_safe_mode")==="1";
      var d=document.createElement("div");
      d.style.cssText="position:fixed;inset:0;z-index:100001;background:#fff;color:#1C1C1E;font:14px/1.5 'Inter',-apple-system,sans-serif;padding:24px 18px;overflow:auto";
      d.innerHTML='<h2 style="font-size:19px;margin:0 0 8px">Приложение не открылось</h2>'+
        '<p style="color:#636366;margin:0 0 16px">Ваши данные на месте — они хранятся в памяти телефона. Сначала скачайте резервную копию, потом попробуйте варианты ниже.</p>'+
        '<div style="display:flex;flex-direction:column;gap:9px;max-width:420px">'+
        '<button id="fhq-b1" style="padding:12px;border:none;border-radius:9px;background:#2C5EE8;color:#fff;font-weight:700;font-size:14px">⬇ Скачать резервную копию</button>'+
        '<button id="fhq-b2" style="padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:600;font-size:14px">↻ Обновить приложение (сбросить кэш)</button>'+
        '<button id="fhq-b3" style="padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:600;font-size:14px">'+(safe?"Выключить безопасный режим":"🛟 Запустить в безопасном режиме")+'</button>'+
        '</div>'+
        '<p style="color:#8E8E93;font-size:11.5px;margin:16px 0 6px">Что произошло (покажите это мне, если не поможет):</p>'+
        '<pre style="background:#FAF9F7;border-radius:8px;padding:11px;font-size:11px;color:#636366;white-space:pre-wrap;word-break:break-word">'+errs.replace(/[<>&]/g,"")+'</pre>';
      document.body.appendChild(d);
      document.getElementById("fhq-b1").onclick=function(){
        try{
          var out={_exported:new Date().toISOString(),_rescue:true};
          for(var i=0;i<localStorage.length;i++){
            var k=localStorage.key(i);
            if(k&&(k.indexOf("lhq_")===0||k.indexOf("fhq_")===0)){
              try{ out[k.replace(/^lhq_|^fhq_/,"")]=JSON.parse(localStorage.getItem(k)); }catch(_){ }
            }
          }
          var b=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
          var a=document.createElement("a"); a.href=URL.createObjectURL(b);
          a.download="fizmat_rescue_"+new Date().toISOString().slice(0,10)+".json"; a.click();
        }catch(e){ alert("Не удалось выгрузить: "+(e&&e.message||e)); }
      };
      document.getElementById("fhq-b2").onclick=function(){
        var done=function(){ location.replace(location.pathname+"?r="+Date.now()); };
        try{
          var jobs=[];
          if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));
          if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
            jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));
          Promise.all(jobs).then(done,done);
          setTimeout(done,2500);
        }catch(_){ done(); }
      };
      document.getElementById("fhq-b3").onclick=function(){
        try{ if(safe) localStorage.removeItem("fhq_safe_mode"); else localStorage.setItem("fhq_safe_mode","1"); }catch(_){}
        location.reload();
      };
    }, 8000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
<script type="text/babel">
const{useState,useMemo,useCallback,useEffect,useRef,Fragment}=React;

/* ── GOOGLE DRIVE SYNC CONFIG ────────────────────────────────── */
const GDRIVE_CLIENT_ID = "990972180057-3omua3qvnleek6tfkap09l4i471cub0a.apps.googleusercontent.com";
const GDRIVE_SCOPE     = "https://www.googleapis.com/auth/drive.appdata";
const GDRIVE_FILE      = "fizmat-hq-data.json";

let gToken  = null;
let gFileId = null;

function gAuth(){
  return new Promise((resolve, reject)=>{
    if(!window.google||!window.google.accounts){
      reject(new Error("Google API не загрузился. Обновите страницу.")); return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: r=>{
        if(r.error){ reject(new Error("Google: "+r.error)); return; }
        gToken = r.access_token;
        localStorage.setItem("fhq_gdrive_token", r.access_token);
        resolve(r.access_token);
      }
    });
    client.requestAccessToken({prompt: "select_account"});
  });
}

/* Тихое обновление токена без диалога выбора аккаунта (prompt:"").
   Используется, когда access-токен протух (живёт ~1 час). */
function gAuthSilent(){
  return new Promise((resolve, reject)=>{
    if(!window.google || !window.google.accounts){ reject(new Error("Google API не загрузился")); return; }
    let done=false;
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: r=>{
        done=true;
        if(r.error){ reject(new Error("Google: "+r.error)); return; }
        gToken = r.access_token;
        localStorage.setItem("fhq_gdrive_token", r.access_token);
        resolve(r.access_token);
      },
      error_callback: e=>{ done=true; reject(new Error((e&&e.type)||"auth_error")); }
    });
    try{ client.requestAccessToken({prompt: ""}); }catch(e){ reject(e); }
    setTimeout(()=>{ if(!done) reject(new Error("silent auth timeout")); }, 8000);
  });
}

/* Обёртка над fetch к Google: сама подставляет Authorization и при 401/403
   один раз тихо обновляет токен и повторяет запрос. */
async function gFetch(url, opts, _retried){
  opts = opts || {};
  const token = gToken || localStorage.getItem("fhq_gdrive_token");
  const headers = Object.assign({}, opts.headers, {Authorization: "Bearer "+token});
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if((r.status===401 || r.status===403) && !_retried){
    try{ await gAuthSilent(); }
    catch(e){ throw new Error("Токен Google истёк — войдите заново. ("+(e&&e.message||e)+")"); }
    return gFetch(url, opts, true);
  }
  return r;
}

/* ── GOOGLE CALENDAR (двусторонний обмен, вручную, только добавление) ─────────
   Доступ к календарю запрашивается ОТДЕЛЬНО и по требованию — вход через Google
   Диск это не затрагивает. Всё аддитивно: кнопки только создают события и ничего
   не удаляют, поэтому худшее возможное последствие — дубликат, но не потеря данных.
   Требуется включённый Google Calendar API и разрешённый scope в вашем OAuth-проекте. */
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
let gCalTok = null;
function gCalAuth(interactive){
  return new Promise((resolve,reject)=>{
    if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
      reject(new Error("Google API не загрузился. Обновите страницу.")); return;
    }
    try{
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GDRIVE_CLIENT_ID,
        scope: GCAL_SCOPE,
        callback: (r)=>{ if(r&&r.error){reject(new Error("Google: "+r.error));return;} gCalTok=r.access_token; resolve(gCalTok); }
      });
      client.requestAccessToken({prompt: interactive?"consent":""});
    }catch(e){ reject(e); }
  });
}
async function gcalFetch(url, opts, interactive){
  opts = opts || {};
  if(interactive===undefined) interactive = true;
  if(!gCalTok){
    // В фоне пытаемся получить токен молча; интерактивное окно показываем только по кнопке.
    if(interactive) await gCalAuth(true);
    else await gCalAuth(false);
  }
  const doFetch = ()=>fetch(url, Object.assign({}, opts, {headers: Object.assign({}, opts.headers, {Authorization:"Bearer "+gCalTok})}));
  let res = await doFetch();
  // 401 — токен протух, тихо обновляем и пробуем ещё раз.
  // 403 почти всегда означает не проблему с правами, а то, что Calendar API не включён в
  // проекте — повторный запрос согласия тут не поможет, поэтому не показываем его повторно.
  if(res.status===401){
    try{ await gCalAuth(interactive?true:false); }
    catch(e){ throw new Error("Нет доступа к Google Календарю. ("+(e&&e.message||e)+")"); }
    res = await doFetch();
  }
  return res;
}

/* ── IndexedDB-зеркало ────────────────────────────────────────
   Дублирует данные из localStorage. Переживает «очистку кэша сайта»
   надёжнее, чем localStorage, и снимает потолок в ~5 МБ. Работает
   best-effort: любая ошибка молча игнорируется. */
const IDB_NAME="fizmat-hq", IDB_STORE="kv";
let _idbP=null;
function idbOpen(){
  if(_idbP) return _idbP;
  _idbP=new Promise((res)=>{
    try{
      const rq=indexedDB.open(IDB_NAME,1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch{} };
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
    }catch{ res(null); }
  });
  return _idbP;
}
async function idbSet(k,v){
  const db=await idbOpen(); if(!db) return;
  return new Promise(res=>{ try{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch{ res(); } });
}
async function idbGet(k){
  const db=await idbOpen(); if(!db) return undefined;
  return new Promise(res=>{ try{ const tx=db.transaction(IDB_STORE,"readonly"); const rq=tx.objectStore(IDB_STORE).get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined); }catch{ res(undefined); } });
}

/* Объединяет два массива записей по id (union). Сохраняет обе стороны;
   при совпадении id берёт запись с более свежим updatedAt, иначе — облачную.
   Именно это устраняет затирание данных при работе с двух устройств. */
function mergeById(local,cloud,tombs){
  if(!Array.isArray(local)) return Array.isArray(cloud)?cloud:local;
  if(!Array.isArray(cloud)) return local;
  const tm=tombs||{};
  const byId=new Map(), noId=[], seen=new Set();
  const push=(it,fromCloud)=>{
    if(it && it.id!=null){
      const k=String(it.id), ex=byId.get(k);
      if(!ex){ byId.set(k,it); return; }
      const a=Date.parse(ex.updatedAt||ex.createdAt||"")||0;
      const b=Date.parse(it.updatedAt||it.createdAt||"")||0;
      byId.set(k, (fromCloud? b>=a : b>a) ? it : ex);
    } else {
      const sig=JSON.stringify(it);           // без id — дедуп по содержимому
      if(!seen.has(sig)){ seen.add(sig); noId.push(it); }
    }
  };
  local.forEach(it=>push(it,false));
  cloud.forEach(it=>push(it,true));
  // Убираем то, что было удалено, если правка не новее удаления.
  const res=[];
  byId.forEach((it,k)=>{
    const del=tm[k];
    if(del){
      const upd=Date.parse(it.updatedAt||it.createdAt||"")||0;
      if(upd<=(Date.parse(del)||0)) return;   // удаление новее правки — не возвращаем
    }
    res.push(it);
  });
  return [...res, ...noId];
}
// Объединение реестров удалений двух устройств (побеждает более позднее).
function tombMerge(a,b){
  const out={};
  const put=src=>{ Object.keys(src||{}).forEach(key=>{
    const m=out[key]||(out[key]={}), s=src[key]||{};
    Object.keys(s).forEach(id=>{ if(!m[id]||(Date.parse(s[id])||0)>(Date.parse(m[id])||0)) m[id]=s[id]; });
  }); };
  put(a); put(b);
  return out;
}

/* ── УЧЁТ УДАЛЕНИЙ И ПРАВОК ДЛЯ СИНХРОНИЗАЦИИ ──────────────────────────────
   Раньше слияние с облаком было объединением (union): оно не умело выражать
   удаление, поэтому удалённая на одном устройстве запись возвращалась с другого.
   Теперь каждое удаление оставляет «надгробие» (id + время), а каждая правка —
   отметку updatedAt. Это позволяет слиянию понять, что новее: правка или удаление. */
const TOMB_KEY="fhq_tombs";
function tombLoad(){ try{ return JSON.parse(localStorage.getItem(TOMB_KEY)||"{}")||{}; }catch(_){ return {}; } }
function tombSave(t){ try{ localStorage.setItem(TOMB_KEY,JSON.stringify(t)); }catch(_){ } }
// Отмечаем удалённые и снимаем отметку с вернувшихся (например, после «Отменить»).
function tombUpdate(key,goneIds,presentIds,at){
  const t=tombLoad();
  const m=t[key]||{};
  let changed=false;
  (goneIds||[]).forEach(id=>{ m[String(id)]=at; changed=true; });
  (presentIds||[]).forEach(id=>{ if(m[String(id)]){ delete m[String(id)]; changed=true; } });
  if(!changed) return;
  // Подрезаем записи старше 180 дней, чтобы реестр не рос бесконечно.
  const cut=Date.now()-180*864e5;
  Object.keys(m).forEach(id=>{ if((Date.parse(m[id])||0)<cut) delete m[id]; });
  t[key]=m; tombSave(t);
}
function sameExceptStamp(a,b){
  try{
    const x=Object.assign({},a),y=Object.assign({},b);
    delete x.updatedAt; delete y.updatedAt;
    return JSON.stringify(x)===JSON.stringify(y);
  }catch(_){ return false; }
}
// Проставляет updatedAt новым/изменённым записям и фиксирует удаления.
function trackChanges(key,prev,next){
  if(!Array.isArray(prev)||!Array.isArray(next)) return next;
  const at=new Date().toISOString();
  const pm=new Map();
  prev.forEach(it=>{ if(it&&it.id!=null) pm.set(String(it.id),it); });
  const present=[],seen=new Set();
  const out=next.map(it=>{
    if(!it||typeof it!=="object"||it.id==null) return it;
    const k=String(it.id); seen.add(k); present.push(k);
    const old=pm.get(k);
    if(!old) return it.updatedAt?it:Object.assign({},it,{updatedAt:at});
    if(sameExceptStamp(old,it)) return it;
    return Object.assign({},it,{updatedAt:at});
  });
  const gone=[];
  pm.forEach((_v,k)=>{ if(!seen.has(k)) gone.push(k); });
  if(gone.length||present.length) tombUpdate(key,gone,present,at);
  return out;
}

function useStore(key,def){
  const[v,sv]=useState(()=>{try{const x=localStorage.getItem(key);return x?JSON.parse(x):def;}catch{return def;}});
  // Если в localStorage пусто (напр. после очистки кэша) — поднимаем из IndexedDB.
  useEffect(()=>{
    let alive=true;
    try{
      if(localStorage.getItem(key)==null){
        idbGet(key).then(val=>{
          if(alive && val!=null){ try{ sv(JSON.parse(val)); localStorage.setItem(key,val); }catch{} }
        });
      }
    }catch{}
    return()=>{ alive=false; };
  },[key]);
  const set=useCallback(nv=>{
    sv(prev=>{
      const raw=typeof nv==="function"?nv(prev):nv;
      const r=trackChanges(key,prev,raw);
      const s=JSON.stringify(r);
      try{ localStorage.setItem(key,s); }catch{ warnStorage(); }
      idbSet(key,s); // зеркало best-effort
      return r;
    });
  },[key]);
  return[v,set];
}

function genRec(rls,excs,students,from,to){
  const res=[],f=new Date(from),t=new Date(to);
  rls.filter(r=>r.active).forEach(r=>{
    const st=students.find(s=>s.id===r.studentId);
    const cur=new Date(f);
    while(cur<=t){
      const wd=cur.getDay()===0?7:cur.getDay();
      if(wd===r.weekday){
        const dk=iso(cur);
        if((!r.startDate||dk>=r.startDate)&&(!r.endDate||dk<=r.endDate)&&!excs.some(e=>e.recurringId===r.id&&e.date===dk)){
          const isSchool=r.type==="school";
          res.push({id:`rec_${r.id}_${dk}`,isRecurring:true,recurringId:r.id,
            studentId:isSchool?undefined:r.studentId,
            title:isSchool?(r.title||"Школа"):(st?.name||"Урок"),
            type:isSchool?"school":"lesson",date:dk,
            time:r.time,duration:r.duration,status:"planned",
            price:isSchool?0:(r.priceOverride!=null?r.priceOverride:(st?.price||0))});
        }
      }
      cur.setDate(cur.getDate()+1);
    }
  });
  return res;
}

function layoutEvents(evs){
  const es=evs.map(e=>({...e,_s:toMin(e.time),_e:toMin(e.time)+(Number(e.duration)||60)}));
  es.sort((a,b)=>a._s-b._s||(a.id>b.id?1:-1));
  const colEnds=[];
  es.forEach(ev=>{
    let col=-1;
    for(let i=0;i<colEnds.length;i++){if(colEnds[i]<=ev._s){col=i;break;}}
    if(col===-1){col=colEnds.length;colEnds.push(0);}
    colEnds[col]=ev._e;ev._col=col;
  });
  const total=Math.max(1,colEnds.length);
  return es.map(ev=>({...ev,_total:total}));
}

/* ── CHARTS ──────────────────────────────────────────────────── */
function DonutChart({segments,size=160,stroke=18,label,sublabel}){
  const r=(size-stroke)/2;
  const circ=2*Math.PI*r;
  const total=segments.reduce((s,x)=>s+(x.value||0),0)||1;
  let offset=0;
  const arcs=segments.map(seg=>{
    const pct=(seg.value||0)/total;
    const dash=pct*circ;
    const arc={...seg,dash,offset,startDeg:offset/circ*360};
    offset+=dash;
    return arc;
  });
  return(
    <div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.surface2} strokeWidth={stroke}/>
        {arcs.map((arc,i)=>(
          <circle
            key={i}
            cx={size/2} cy={size/2} r={r}
            fill="none"
            stroke={arc.color}
            strokeWidth={stroke}
            strokeDasharray={`${arc.dash} ${circ}`}
            strokeDashoffset={-arc.offset}
            strokeLinecap="round"
            className="ring-path"
            style={{transitionDelay:`${i*0.08}s`}}
          />
        ))}
      </svg>
      {(label||sublabel)&&(
        <div style={{
          position:"absolute",textAlign:"center",
          pointerEvents:"none"
        }}>
          {label&&<div style={{fontSize:20,fontWeight:800,letterSpacing:"-0.04em",color:T.text,lineHeight:1}}>{label}</div>}
          {sublabel&&<div style={{fontSize:11,color:T.t3,marginTop:3,fontWeight:500}}>{sublabel}</div>}
        </div>
      )}
    </div>
  );
}

function BarChart({data,height=120,color,valueKey="v",labelKey="l",currency=false,animated=true}){
  const max=Math.max(...data.map(x=>x[valueKey]||0),1);
  return(
    <div style={{display:"flex",gap:6,alignItems:"flex-end",height}}>
      {data.map((x,i)=>{
        const val=x[valueKey]||0;
        const barH=Math.max(3,(val/max)*(height-28));
        const isActive=x.active;
        return(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            {val>0&&(
              <div style={{fontSize:9,color:T.t2,fontWeight:700,letterSpacing:"-0.01em"}}>
                {currency?(val>9999?`${Math.round(val/1000)}к`:fmtM(val)):val}
              </div>
            )}
            <div style={{
              width:"100%",
              background:isActive?x.color||color:color||(x.color||T.accent),
              borderRadius:"4px 4px 0 0",
              height:barH,
              opacity:isActive?1:(val>0?0.6:0.15),
              transition:animated?"height 0.5s cubic-bezier(0.4,0,0.2,1)":"none",
            }}/>
            <div style={{fontSize:9,color:T.t3,fontWeight:500,textAlign:"center",lineHeight:1.2}}>
              {x[labelKey]||x.m?.slice(5)||x.d||""}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function LineChart({data,height=100,color="#2C5EE8",valueKey="v",labelKey="l",fill=true}){
  if(!data||data.length<2)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:T.t3,fontSize:12}}>Мало данных</div>;
  const max=Math.max(...data.map(x=>x[valueKey]||0),1);
  const min=Math.min(...data.map(x=>x[valueKey]||0),0);
  const range=Math.max(max-min,1);
  const w=300,h=height-24;
  const pts=data.map((x,i)=>{
    const px=(i/(data.length-1))*w;
    const py=h-(((x[valueKey]||0)-min)/range)*h;
    return[px,py];
  });
  const poly=pts.map(p=>p.join(",")).join(" ");
  const area=`M${pts[0][0]},${h} ${pts.map(p=>`L${p[0]},${p[1]}`).join(" ")} L${pts[pts.length-1][0]},${h} Z`;
  return(
    <div style={{width:"100%"}}>
      <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",overflow:"visible"}}>
        <defs>
          <linearGradient id={`grad_${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {fill&&<path d={area} fill={`url(#grad_${color.replace("#","")})`}/>}
        <polyline points={poly} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="line-path"/>
        {pts.map(([px,py],i)=>(
          <circle key={i} cx={px} cy={py} r={3.5} fill={T.surface} stroke={color} strokeWidth={2}/>
        ))}
        {data.map((x,i)=>(
          <text key={i} x={pts[i][0]} y={height-2} textAnchor="middle" fontSize="9" fill={T.t3} fontWeight="500">
            {x[labelKey]||x.m?.slice(5)||""}
          </text>
        ))}
      </svg>
    </div>
  );
}

function RingGauge({pct,color,size=80,stroke=8,label,sublabel}){
  const r=(size-stroke*2)/2;
  const circ=2*Math.PI*r;
  const dash=Math.max(0,circ*(Math.min(pct,100)/100));
  return(
    <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth={stroke}/>
        <circle
          cx={size/2} cy={size/2} r={r} fill="none"
          stroke={color} strokeWidth={stroke}
          strokeDasharray={`${dash} ${circ}`}
          strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}
          style={{transition:"stroke-dasharray 0.8s cubic-bezier(0.4,0,0.2,1)"}}
        />
        <text x={size/2} y={size/2+4} textAnchor="middle" fontSize={12} fontWeight={800} fill={color} letterSpacing="-0.03em">
          {pct}%
        </text>
      </svg>
      {label&&<div style={{fontSize:11,fontWeight:600,color:T.t2,textAlign:"center"}}>{label}</div>}
      {sublabel&&<div style={{fontSize:10,color:T.t3,textAlign:"center"}}>{sublabel}</div>}
    </div>
  );
}

        <Inp value={form.topic} onChange={v=>setForm(p=>({...p,topic:v}))} placeholder="Например: Законы Ньютона"/>
      </Field>
      <Field label="Что получилось">
        <Txa value={form.result} onChange={v=>setForm(p=>({...p,result:v}))} rows={2} placeholder="Разобрали теорию, решили 5 задач..."/>
      </Field>
      <Field label="Домашнее задание">
        <Inp value={form.homework} onChange={v=>setForm(p=>({...p,homework:v}))} placeholder="Задачи 12-15 из сборника"/>
      </Field>
      <Field label="Следующий шаг">
        <Inp value={form.nextStep} onChange={v=>setForm(p=>({...p,nextStep:v}))} placeholder="Перейти к электричеству"/>
      </Field>
      <SaveRow onClose={onClose} onSave={save}/>
    </Modal>
  );
}

/* ══════════════════════════════════════════════════════════════
   HOME
══════════════════════════════════════════════════════════════ */
function Home({store,setTab}){
  const { isMobile } = useDevice();
  const{events,students,expenses,incomes,tasks,goals,rls,excs,payments,lessonLog,setQuickLog}=store;
  const now=new Date(),t=today(),mStr=localYM(now);
  const wDates=getWeek(0),wS=iso(wDates[0]),wE=iso(wDates[6]);
  const recW=useMemo(()=>genRec(rls,excs,students,wS,wE),[rls,excs,students,wS,wE]);
  const allW=[...events.filter(e=>e.date>=wS&&e.date<=wE),
    ...recW.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&e.studentId===r.studentId))];
  const mInc=incomes.filter(i=>i.date.startsWith(mStr)).reduce((s,i)=>s+(Number(i.amount)||0),0);
  const mExp=expenses.filter(e=>e.date.startsWith(mStr)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const pStr=localYM(new Date(now.getFullYear(),now.getMonth()-1,1));
  const pInc=incomes.filter(i=>i.date.startsWith(pStr)).reduce((s,i)=>s+(Number(i.amount)||0),0);
  const incTrend=pInc>0?{dir:mInc>=pInc?"↑":"↓",pct:Math.abs(Math.round((mInc-pInc)/pInc*100)),up:mInc>=pInc}:null;
  const todayRec=genRec(rls,excs,students,t,t);
  const todayEv=[...events.filter(e=>e.date===t),
    ...todayRec.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&e.studentId===r.studentId))]
    .sort((a,b)=>a.time>b.time?1:-1);
  const nowStr=now.toTimeString().slice(0,5);
  const currentEv=useMemo(()=>todayEv.find(ev=>{
    try{const end=addMin(ev.time||"00:00",Number(ev.duration)||60);
      return(ev.time?.slice(0,5)||"")<=nowStr&&nowStr<end;}catch{return false;}
  }),[todayEv,nowStr]);
  const nextEv=todayEv.find(e=>(e.time?.slice(0,5)||"")>nowStr);
  const todayL=todayEv.filter(e=>e.type==="lesson");
  const mLessDone=events.filter(e=>e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length;
  const pendPay=students.map(s=>{
    const ch=events.filter(e=>sameId(e.studentId,s.id)&&e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length*(Number(s.price)||0);
    const pd=payments.filter(p=>sameId(p.studentId,s.id)&&p.date?.startsWith(mStr)&&p.status!=="cancelled").reduce((a,p)=>a+(Number(p.amount)||0),0);
    return{s,left:Math.max(0,ch-pd)};
  }).filter(x=>x.left>0);
  const todayForecast=todayL.reduce((s,l)=>{const st=students.find(x=>x.id===l.studentId);return s+(Number(l.price||st?.price)||0);},0);
  const overdueTasks=tasks.filter(t=>t.status!=="done"&&t.deadline&&t.deadline<today());
  const activeTasks=tasks.filter(t=>t.status!=="done");
  const greetHour=now.getHours();
  const greet=greetHour<12?"Доброе утро":greetHour<18?"Добрый день":"Добрый вечер";
  const MN2=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

  // "Что сделать сегодня"
  const todayActions=[];
  todayL.filter(e=>e.status==="planned").forEach(l=>{
    const st=students.find(s=>s.id===l.studentId);
    todayActions.push({icon:"📚",text:`Урок — ${st?.name||"ученик"} в ${l.time?.slice(0,5)}`,tab:"calendar"});
  });
  pendPay.slice(0, isMobile ? 2 : 3).forEach(({s,left})=>{
    todayActions.push({icon:"💰",text:`Напомнить об оплате — ${s.name} (${fmtM(left)} ₽)`,tab:"payments"});
  });
  overdueTasks.slice(0, isMobile ? 1 : 2).forEach(t2=>{
    todayActions.push({icon:"⚠️",text:`Просроченная задача: ${t2.title}`,tab:"tasks"});
  });
  const doneTodayNoLog=todayL.filter(l=>l.status==="done").filter(l=>{
    return !(Array.isArray(lessonLog)?lessonLog:[]).some(j=>sameId(j.studentId,l.studentId)&&j.date===t);
  });
  doneTodayNoLog.slice(0, isMobile ? 1 : 3).forEach(l=>{
    const st=students.find(s=>s.id===l.studentId);
    todayActions.push({icon:"📔",text:`Заполнить журнал — ${st?.name||"ученик"}`,tab:"_quicklog",studentId:l.studentId,date:t});
  });
  if(todayActions.length===0&&todayL.length===0)

  // Данные для недели
  const weekDays = wDates.map(d => iso(d));

    const dayEv = allW.filter(e => e.date === dk).sort((a,b)=>a.time>b.time?1:-1);

  // Адаптивные отступы и размеры

          <div className="pulse-dot" style={{width: isMobile ? 7 : 9,height: isMobile ? 7 : 9,borderRadius:"50%",background:"rgba(255,255,255,0.9)",flexShrink:0}}/>

            <div style={{fontSize: isMobile ? 10 : 12,opacity:0.8}}>{currentEv.time?.slice(0,5)} — {addMin(currentEv.time||"00:00",Number(currentEv.duration)||60)}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize: isMobile ? 8 : 10,opacity:0.65}}>осталось</div>

      </div>

      {/* What to do today */}
      <div style={{marginBottom:16}}>
        <Card style={{ padding: pad }}>
          <div style={{fontWeight:700,fontSize: fontSizeTitle,marginBottom: isMobile ? 8 : 12,letterSpacing:"-0.02em",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>Что сделать сегодня</span>
            <span style={{fontSize: isMobile ? 10 : 11,color:T.t3,fontWeight:400}}>{todayActions.length} пунктов</span>

          <div style={{display:"flex",flexDirection:"column",gap: isMobile ? 4 : 7}}>
            {todayActions.slice(0, isMobile ? 5 : 10).map((a,i)=>(
              <div key={i} onClick={()=>{if(a.tab==="_quicklog"){setQuickLog({studentId:a.studentId,date:a.date||today()});}else if(a.tab!=="home"){setTab(a.tab);}}}
                style={{display:"flex",alignItems:"center",gap: isMobile ? 6 : 10,padding: isMobile ? "6px 8px" : "9px 12px",borderRadius: isMobile ? 6 : 9,background:T.surface2,cursor:a.tab!=="home"?"pointer":"default",border:`1px solid ${T.border}`,transition:"background 0.1s",fontSize: isMobile ? 11 : 13}}
                onMouseEnter={e=>{if(a.tab!=="home")e.currentTarget.style.background="#E0E7FF";}}

      </div>

        {[
          {v:`${fmtM(mInc)} ₽`,l:"Доход месяца",c:T.accent2,bg:"#F3F0FF",tr:incTrend},
          {v:`${fmtM(mInc-mExp)} ₽`,l:"Прибыль",c:mInc-mExp>=0?T.green:T.red,bg:mInc-mExp>=0?"#EDFBF3":"#FEF2F2"},
          {v:mLessDone,l:"Уроков в месяце",c:T.accent,bg:"#EEF2FF"},
          {v:activeTasks.length,l:"Активных задач",c:T.amber,bg:"#FFFBEB",alert:overdueTasks.length>0},
        ].slice(0, isMobile ? 2 : 4).map((c,i)=>(
          <div key={c.l} className="anim-fade-up" style={{background:c.bg,borderRadius: isMobile ? 10 : 12,padding: isMobile ? "10px 12px" : "14px 16px",border:`1px solid ${T.border}`,boxShadow:T.shadow,animationDelay:`${i*0.05}s`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:2}}>
              <div style={{fontSize: isMobile ? 17 : 22,fontWeight:800,color:c.c,letterSpacing:"-0.04em"}}>{c.v}</div>
              {c.tr&&<span style={{fontSize: isMobile ? 9 : 11,fontWeight:700,color:c.tr.up?T.green:T.red}}>{c.tr.dir}{c.tr.pct}%</span>}
              {c.alert&&overdueTasks.length>0&&<span style={{fontSize: isMobile ? 9 : 11,fontWeight:700,color:T.red}}>!{overdueTasks.length}</span>}
            </div>
            <div style={{fontSize: isMobile ? 9 : 11,color:T.t2,fontWeight:500}}>{c.l}</div>
          </div>
        ))}
      </div>

      {/* Двухколоночная сетка — адаптивная */}
      <div style={{
        display:"grid",
        gridTemplateColumns: isMobile ? "1fr" : "1fr 2fr",
        gap: isMobile ? 12 : 16

        {/* Левая колонка — Моя неделя */}
        <Card style={{ padding: pad }}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom: isMobile ? 10 : 14}}>
            <div style={{fontWeight:700,fontSize: fontSizeTitle,letterSpacing:"-0.02em"}}>Моя неделя</div>
            <Btn variant="ghost" size="sm" onClick={()=>setTab("week")}>Подробнее →</Btn>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap: isMobile ? 4 : 6}}>
            {weekDays.map((dk,idx)=>{
              const dayData = dayLessons.find(d => d.date === dk);
              const dayEv = dayData ? dayData.events : [];
              const isToday = dk === t;
              return(
                <div key={dk} onClick={()=>setTab("week")} style={{
                  cursor:"pointer",
                  display:"flex",
                  alignItems:"center",
                  gap: isMobile ? 6 : 10,
                  padding: isMobile ? "4px 6px" : "6px 8px",
                  borderRadius:8,
                  background:isToday?`${T.accent}10`:"transparent",
                  border:isToday?`1px solid ${T.accent}30`:"none"
                }}>
                  <div style={{minWidth: isMobile ? 28 : 32}}>
                    <div style={{fontSize: isMobile ? 9 : 10, fontWeight:700, color:isToday?T.accent:T.t3, textTransform:"uppercase", letterSpacing:"0.04em"}}>{DS[idx]}</div>
                    <div style={{fontSize: isMobile ? 12 : 13, fontWeight:700, color:isToday?T.accent:T.text}}>{wDates[idx].getDate()}</div>
                  </div>
                  <div style={{flex:1, display:"flex", flexWrap:"wrap", gap: isMobile ? 2 : 3}}>
                    {dayEv.length===0
                      ?<span style={{fontSize: isMobile ? 10 : 11, color:T.t3, fontStyle:"italic"}}>Свободно</span>
                      :dayEv.slice(0, isMobile ? 2 : 3).map(ev=>{

        {/* Правая колонка — три карточки */}

                const st=students.find(s=>s.id===ev.studentId);

                  <div key={ev.id} onClick={()=>setTab("calendar")} style={{display:"flex", alignItems:"center", gap: isMobile ? 6 : 8, padding: isMobile ? "4px 0" : "5px 0", borderBottom:`1px solid ${T.border2}`, cursor:"pointer"}}>

          </Card>

          {/* Ожидают оплаты */}
          <Card style={{ padding: pad }}>

              :pendPay.slice(0, isMobile ? 3 : 4).map(({s,left})=>(
                <div key={s.id} onClick={()=>setTab("payments")} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding: isMobile ? "4px 0" : "5px 0", borderBottom:`1px solid ${T.border2}`, cursor:"pointer"}}>
                  <div>
                    <div style={{fontWeight:600, fontSize: fontSizeMedium}}>{s.name}</div>
                    <div style={{fontSize: fontSizeSmall, color:T.t3}}>{s.subject}</div>
                  </div>
                  <span style={{fontWeight:700, color:T.red, fontSize: isMobile ? 12 : 13}}>{fmtM(left)} ₽</span>
                </div>

            <div style={{marginTop: isMobile ? 6 : 8}}><Btn variant="ghost" size="sm" onClick={()=>setTab("payments")}>К платежам →</Btn></div>
          </Card>

          {/* Задачи */}
          <Card style={{ padding: pad }}>
            <div style={{fontWeight:700,fontSize: fontSizeCardTitle, marginBottom: isMobile ? 8 : 12, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <span>Задачи</span>
              {overdueTasks.length>0&&<span style={{fontSize: isMobile ? 10 : 11, background:"#FEF2F2", color:T.red, borderRadius:99, padding:"1px 8px", fontWeight:600}}>!{overdueTasks.length} просрочено</span>}
            </div>
            {activeTasks.length===0
              ?<div style={{textAlign:"center", padding: isMobile ? "4px 0" : "8px 0", color:T.t3, fontSize: isMobile ? 12 : 13}}>Задач нет ✓</div>
              :[...overdueTasks,...activeTasks.filter(t=>!overdueTasks.includes(t))].slice(0, isMobile ? 3 : 4).map(t2=>{
                const od=overdueTasks.includes(t2);
                return(
                  <div key={t2.id} onClick={()=>setTab("tasks")} style={{display:"flex", alignItems:"center", gap: isMobile ? 6 : 8, padding: isMobile ? "4px 0" : "5px 0", borderBottom:`1px solid ${T.border2}`, cursor:"pointer"}}>
                    <div style={{width: isMobile ? 5 : 6, height: isMobile ? 5 : 6, borderRadius:"50%", background:od?T.red:PRC[t2.priority]||T.t3, flexShrink:0}}/>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize: fontSizeMedium, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", color:od?T.red:T.text}}>{t2.title}</div>
