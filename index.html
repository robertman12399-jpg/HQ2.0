  // Google Календарь — отправить уроки текущей недели (только добавление, с защитой от дублей).
  async function pushWeekToGCal(){
    try{
      const pad=s=>{const p=String(s||"").split(":");return String(p[0]||"0").padStart(2,"0")+":"+String(p[1]||"00").padStart(2,"0");};
      const wDates=getWeek(0), wS=iso(wDates[0]), wE=iso(wDates[6]);
      const rec=genRec(rls,excs,students,wS,wE);
      const weekLessons=[
        ...events.filter(e=>e.type==="lesson"&&e.date>=wS&&e.date<=wE&&e.status!=="cancelled"),
        ...rec.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&sameId(e.studentId,r.studentId)))
      ];
      if(weekLessons.length===0){ alert("На этой неделе нет уроков (ни в календаре, ни в расписании) — отправлять нечего."); return; }
      let pushedArr=[]; try{pushedArr=JSON.parse(localStorage.getItem("fhq_gcal_pushed")||"[]");}catch(_){pushedArr=[];}
      const pushedSet=new Set(pushedArr);
      const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"Europe/Moscow";
      let created=0, skipped=0, failed=0, firstErr="";
      for(const e of weekLessons){
        const st=students.find(s=>sameId(s.id,e.studentId));
        const time=pad(e.time||"10:00");
        const key=e.date+"T"+time+"|"+(e.studentId||"");
        if(pushedSet.has(key)){skipped++;continue;}
        const end=pad(addMin(time,Number(e.duration)||60));
        const body={
          summary:(e.title||st?.name||"Урок")+(st?.subject?" · "+st.subject:""),
          description:"FizMat HQ"+(st?.grade?" · "+st.grade+" класс":""),
          start:{dateTime:e.date+"T"+time+":00",timeZone:tz},
          end:{dateTime:e.date+"T"+end+":00",timeZone:tz}
        };
        const res=await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        if(res.ok){created++; pushedSet.add(key);}
        else{
          failed++;
          if(!firstErr){ try{const j=await res.json(); firstErr=(j&&j.error&&j.error.message)||("код "+res.status);}catch(_){firstErr="код "+res.status;} console.error("Google Calendar POST error:",res.status,firstErr); }
        }
      }
      localStorage.setItem("fhq_gcal_pushed",JSON.stringify([...pushedSet]));
      if(created===0&&failed>0){
        alert("Не удалось отправить в Google Календарь.\n\nПричина от Google: "+firstErr+"\n\nЧаще всего это значит, что в Google Cloud Console для этого проекта не включён Calendar API (APIs & Services → Library → Google Calendar API → Enable). Инструкция — в README проекта.");
      } else {
        alert("Google Календарь: добавлено "+created+", пропущено (уже были) "+skipped+(failed?(", ошибок "+failed+" ("+firstErr+")"):"")+".");
      }
    }catch(e){ alert("Ошибка отправки в Google Календарь: "+(e&&e.message||e)); }
  }

  // Google Календарь — загрузить события (±6 недель) как обычные события (только добавление).
  async function pullFromGCal(){
    try{
      const now=new Date();
      const tMin=new Date(now); tMin.setDate(tMin.getDate()-14);
      const tMax=new Date(now); tMax.setDate(tMax.getDate()+42);
      const url="https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin="+encodeURIComponent(tMin.toISOString())+"&timeMax="+encodeURIComponent(tMax.toISOString());
      const res=await gcalFetch(url,{method:"GET"});
      if(!res.ok){
        let reason="код "+res.status;
        try{const j=await res.json(); reason=(j&&j.error&&j.error.message)||reason;}catch(_){}
        console.error("Google Calendar GET error:",res.status,reason);
        alert("Не удалось загрузить из Google Календаря.\n\nПричина от Google: "+reason+"\n\nЧаще всего это значит, что в Google Cloud Console для этого проекта не включён Calendar API (APIs & Services → Library → Google Calendar API → Enable). Инструкция — в README проекта.");
        return;
      }
      const data=await res.json();
      const items=Array.isArray(data.items)?data.items:[];
      let impArr=[]; try{impArr=JSON.parse(localStorage.getItem("fhq_gcal_imported")||"[]");}catch(_){impArr=[];}
      const impSet=new Set(impArr);
      const existingGids=new Set((Array.isArray(events)?events:[]).map(e=>e.gcalId).filter(Boolean));
      const toAdd=[];
      for(const g of items){
        if(!g||!g.id||g.status==="cancelled")continue;
        if(impSet.has(g.id)||existingGids.has(g.id))continue;
        const s=g.start&&(g.start.dateTime||g.start.date);
        if(!s)continue;
        const allDay=!(g.start&&g.start.dateTime);
        const dt=new Date(s);
        if(isNaN(dt))continue;
        const date=iso(dt);
        const time=allDay?"":(String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"));
        let dur=60;
        if(g.end&&g.end.dateTime&&g.start.dateTime){ dur=Math.max(15,Math.round((new Date(g.end.dateTime)-new Date(g.start.dateTime))/60000)); }
        toAdd.push({id:"g_"+g.id,gcalId:g.id,title:g.summary||"Событие",type:"other",date,time,duration:dur,status:"planned",allDay});
        impSet.add(g.id);
      }
      if(toAdd.length===0){ alert("Новых событий в Google Календаре не найдено."); return; }
      const _pe=events;
      setEvents([...(Array.isArray(events)?events:[]),...toAdd]);
      pushUndo("Импорт из календаря",()=>setEvents(_pe));
      localStorage.setItem("fhq_gcal_imported",JSON.stringify([...impSet]));
      alert("Импортировано "+toAdd.length+" событий из Google Календаря.");
    }catch(e){ alert("Ошибка загрузки из Google Календаря: "+(e&&e.message||e)); }
  }

  // ── ДВУСТОРОННЯЯ СИНХРОНИЗАЦИЯ С GOOGLE КАЛЕНДАРЁМ ────────────────────────
  // Окно синхронизации и предохранители.
  const GCAL_BASE="https://www.googleapis.com/calendar/v3/calendars/primary/events";
  const GCAL_BACK_DAYS=14, GCAL_FWD_DAYS=60, GCAL_MAX_DELETES=25;
  const gcalBusyRef=useRef(false);
  const gcalApplyingRef=useRef(false);
  const gcalFnRef=useRef(null);
  const[gcalRunning,setGcalRunning]=useState(false);

  function gcalPad(s){const p=String(s||"").split(":");return String(p[0]||"0").padStart(2,"0")+":"+String(p[1]||"00").padStart(2,"0");}
  function gcalTZ(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Moscow";}catch(_){return "Europe/Moscow";}}
  function gcalBody(ev,st){
    const time=gcalPad(ev.time||"10:00");
    const end=gcalPad(addMin(time,Number(ev.duration)||60));
    const tz=gcalTZ();
    return{
      summary:(ev.title||st?.name||(ev.type==="lesson"?"Урок":"Событие"))+(ev.type==="lesson"&&st?.subject?" · "+st.subject:""),
      description:"FizMat HQ"+(st?.grade?" · "+st.grade+" класс":""),
      start:{dateTime:ev.date+"T"+time+":00",timeZone:tz},
      end:{dateTime:ev.date+"T"+end+":00",timeZone:tz}
    };
  }
  function gcalWindow(){
    const a=new Date(); a.setDate(a.getDate()-GCAL_BACK_DAYS);
    const b=new Date(); b.setDate(b.getDate()+GCAL_FWD_DAYS);
    return{from:iso(a),to:iso(b),minISO:a.toISOString(),maxISO:b.toISOString()};
  }
  function gcalErrText(res,fallback){
    return res.json().then(j=>(j&&j.error&&j.error.message)||fallback).catch(()=>fallback);
  }

  async function gcalSyncNow(options){
    const opts=options||{};
    const silent=!!opts.silent;
    const interactive=!silent;
    if(gcalBusyRef.current) return;
    if(!(user&&user.type==="google")){ if(!silent)alert("Сначала войдите через Google."); return; }
    gcalBusyRef.current=true; setGcalRunning(true);
    const win=gcalWindow();
    const snapshot=Array.isArray(events)?events:[];
    let work=[...snapshot];
    let recMap=Object.assign({},gcalRecMap||{});
    let skip=new Set(Array.isArray(gcalSkip)?gcalSkip:[]);
    let tombs=Array.isArray(gcalTomb)?[...gcalTomb]:[];
    let meta=Object.assign({},gcalMeta||{});
    let pulledNew=0,pulledUpd=0,pulledDel=0,pushedNew=0,pushedUpd=0,pushedDel=0,protectedCnt=0;
    let changedLocal=false;
    try{
      // ── 1. ЗАБИРАЕМ ИЗМЕНЕНИЯ ИЗ GOOGLE (инкрементально по syncToken) ──
      let items=[],pageToken=null,useToken=meta.syncToken||null,guard=0,newSyncToken=null;
      while(guard++<10){
        let url;
        if(useToken){
          url=GCAL_BASE+"?singleEvents=true&showDeleted=true&maxResults=250&syncToken="+encodeURIComponent(useToken);
        }else{
          url=GCAL_BASE+"?singleEvents=true&showDeleted=true&orderBy=startTime&maxResults=250&timeMin="+encodeURIComponent(win.minISO)+"&timeMax="+encodeURIComponent(win.maxISO);
        }
        if(pageToken) url+="&pageToken="+encodeURIComponent(pageToken);
        const res=await gcalFetch(url,{method:"GET"},interactive);
        if(res.status===410){ // syncToken устарел — начинаем полный проход заново
          useToken=null; pageToken=null; items=[]; meta.syncToken=null; continue;
        }
        if(!res.ok){
          const reason=await gcalErrText(res,"код "+res.status);
          throw new Error(reason);
        }
        const data=await res.json();
        items=items.concat(Array.isArray(data.items)?data.items:[]);
        if(data.nextPageToken){ pageToken=data.nextPageToken; continue; }
        newSyncToken=data.nextSyncToken||null;
        break;
      }

      // Сначала считаем удаления — если их подозрительно много, ничего не трогаем.
      const recIds=new Set(Object.values(recMap));
      const cancelled=items.filter(g=>g&&g.id&&g.status==="cancelled");
      const wouldDelete=cancelled.filter(g=>work.some(e=>e.gcalId===g.id&&!(e.type==="lesson"&&e.status==="done"))).length;
      if(wouldDelete>GCAL_MAX_DELETES){
        throw new Error("В Google Календаре удалено "+wouldDelete+" событий за раз. Это больше предохранителя ("+GCAL_MAX_DELETES+"), поэтому синхронизация остановлена и ничего не удалено. Проверьте календарь; если удаление верное — нажмите «Синхронизировать» ещё раз после уменьшения объёма или отключите синхронизацию.");
      }

      for(const g of items){
        if(!g||!g.id) continue;
        if(g.status==="cancelled"){
          // Удалено в Google → удаляем локально (с защитой проведённых уроков).
          const idx=work.findIndex(e=>e.gcalId===g.id);
          if(idx>=0){
            const loc=work[idx];
            if(loc.type==="lesson"&&loc.status==="done"){
              // Проведённый урок связан с деньгами — не удаляем, только отвязываем.
              // noGcal не даёт создать его в Google заново (иначе удаление откатывалось бы).
              const c={...loc,noGcal:true}; delete c.gcalId; work[idx]=c; protectedCnt++; changedLocal=true;
            }else{
              work.splice(idx,1); pulledDel++; changedLocal=true;
            }
          }else if(recIds.has(g.id)){
            // Удалён урок, созданный из шаблона расписания — больше не создаём его заново.
            const key=Object.keys(recMap).find(k=>recMap[k]===g.id);
            if(key){ skip.add(key); delete recMap[key]; }
          }
          continue;
        }
        const startRaw=g.start&&(g.start.dateTime||g.start.date);
        if(!startRaw) continue;
        const allDay=!(g.start&&g.start.dateTime);
        const dt=new Date(startRaw);
        if(isNaN(dt)) continue;
        const date=iso(dt);
        const time=allDay?"":(String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"));
        let dur=60;
        if(g.end&&g.end.dateTime&&g.start.dateTime){ dur=Math.max(15,Math.round((new Date(g.end.dateTime)-new Date(g.start.dateTime))/60000)); }
        const remoteUpd=g.updated||nowISO();
        const idx=work.findIndex(e=>e.gcalId===g.id);
        if(idx<0){
          if(recIds.has(g.id)) continue;                 // это наш же урок из шаблона — локальной копии не нужно
          if(date<win.from||date>win.to) continue;       // вне окна синхронизации
          work.push({id:"g_"+g.id,gcalId:g.id,title:g.summary||"Событие",type:"other",date,time,duration:dur,status:"planned",allDay,updatedAt:remoteUpd});
          pulledNew++; changedLocal=true;
        }else{
          const loc=work[idx];
          const localUpd=loc.updatedAt||"";
          // Разрешение конфликта: побеждает более поздняя правка.
          if(localUpd&&localUpd>remoteUpd) continue;     // локальная новее — отправим её ниже
          const upd={...loc,title:g.summary||loc.title,date,time,duration:dur,updatedAt:remoteUpd};
          if(JSON.stringify(upd)!==JSON.stringify(loc)){ work[idx]=upd; pulledUpd++; changedLocal=true; }
        }
      }

      // ── 2. ОТПРАВЛЯЕМ ЛОКАЛЬНЫЕ ИЗМЕНЕНИЯ В GOOGLE ──
      // 2a. Локальные удаления
      const restTombs=[];
      for(const t of tombs){
        if(!t||!t.gcalId){continue;}
        const res=await gcalFetch(GCAL_BASE+"/"+encodeURIComponent(t.gcalId),{method:"DELETE"},interactive);
        if(res.ok||res.status===404||res.status===410){ pushedDel++; }
        else { restTombs.push(t); }
      }
      tombs=restTombs;

      const lastSync=meta.lastSyncAt||"";
      // 2b. Новые и изменённые события приложения
      for(let i=0;i<work.length;i++){
        const e=work[i];
        if(!e||e.isRecurring) continue;
        if(e.noGcal) continue;                 // намеренно отвязано от календаря — не создаём заново
        if(!e.date||e.date<win.from||e.date>win.to) continue;
        if(e.status==="cancelled") continue;
        const st=students.find(s=>sameId(s.id,e.studentId));
        if(!e.gcalId){
          const res=await gcalFetch(GCAL_BASE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(gcalBody(e,st))},interactive);
          if(res.ok){ const j=await res.json(); work[i]={...e,gcalId:j.id,updatedAt:j.updated||nowISO()}; pushedNew++; changedLocal=true; }
          else if(res.status===403){ throw new Error(await gcalErrText(res,"код 403")); }
        }else if(e.updatedAt&&(!lastSync||e.updatedAt>lastSync)){
          const res=await gcalFetch(GCAL_BASE+"/"+encodeURIComponent(e.gcalId),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(gcalBody(e,st))},interactive);
          if(res.ok){ const j=await res.json(); work[i]={...e,updatedAt:j.updated||e.updatedAt}; pushedUpd++; }
          else if(res.status===404||res.status===410){ const c={...e}; delete c.gcalId; work[i]=c; changedLocal=true; }
        }
      }

      // 2c. Уроки из шаблонов расписания — создаём в Google (обратно они не удаляют шаблон)
      const rec=genRec(rls,excs,students,win.from,win.to);
      for(const r of rec){
        const time=gcalPad(r.time||"10:00");
        const key=r.date+"T"+time+"|"+(r.studentId||"");
        if(skip.has(key)||recMap[key]) continue;
        if(work.some(e=>e.date===r.date&&e.time===r.time&&sameId(e.studentId,r.studentId))) continue;
        const st=students.find(s=>sameId(s.id,r.studentId));
        const res=await gcalFetch(GCAL_BASE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(gcalBody(r,st))},interactive);
        if(res.ok){ const j=await res.json(); recMap[key]=j.id; pushedNew++; }
        else if(res.status===403){ throw new Error(await gcalErrText(res,"код 403")); }
      }

      // ── 3. СОХРАНЯЕМ РЕЗУЛЬТАТ ──
      if(changedLocal){
        gcalApplyingRef.current=true;
        const before=snapshot;
        setEvents(work);
        if(pulledDel>0) pushUndo("Синхронизация календаря",()=>setEvents(before));
        setTimeout(()=>{gcalApplyingRef.current=false;},0);
      }
      setGcalTomb(tombs);
      setGcalRecMap(recMap);
      setGcalSkip([...skip]);
      const summary="↓ новых "+pulledNew+", обновлено "+pulledUpd+", удалено "+pulledDel+" · ↑ новых "+pushedNew+", обновлено "+pushedUpd+", удалено "+pushedDel+(protectedCnt?(" · защищено проведённых "+protectedCnt):"");
      setGcalMeta({syncToken:newSyncToken||meta.syncToken||null,lastSyncAt:nowISO(),lastResult:summary,lastError:null});
      if(!silent) alert("Синхронизация завершена.\n\n"+summary+(protectedCnt?"\n\nПроведённые уроки, удалённые в Google, не были удалены здесь — они связаны с оплатой. Они просто отвязаны от календаря.":""));
    }catch(e){
      const msg=(e&&e.message)||String(e);
      console.error("GCal sync error:",e);
      setGcalMeta(Object.assign({},gcalMeta||{},{lastError:msg,lastSyncAt:(gcalMeta&&gcalMeta.lastSyncAt)||null}));
      if(!silent) alert("Синхронизация не удалась.\n\nПричина: "+msg+"\n\nЕсли речь про Calendar API — включите его в Google Cloud Console (инструкция в README). Данные не пострадали.");
    }finally{
      gcalBusyRef.current=false; setGcalRunning(false);
    }
  }
  gcalFnRef.current=gcalSyncNow;

  // Автозапуск: при открытии, каждые 3 минуты и при возврате на вкладку.
  useEffect(()=>{
    if(!gcalOn||safeMode||!(user&&user.type==="google")) return;
    let alive=true;
    const run=()=>{ if(alive&&document.visibilityState==="visible"&&gcalFnRef.current) gcalFnRef.current({silent:true}); };
    const first=setTimeout(run,1500);
    const iv=setInterval(run,3*60*1000);
    const onVis=()=>{ if(document.visibilityState==="visible") run(); };
    document.addEventListener("visibilitychange",onVis);
    return()=>{ alive=false; clearTimeout(first); clearInterval(iv); document.removeEventListener("visibilitychange",onVis); };
  },[gcalOn,user]);

  // Быстрая отправка после локальной правки (через 12 секунд тишины), без петель.
  useEffect(()=>{
    if(!gcalOn||safeMode||!(user&&user.type==="google")) return;
    if(gcalApplyingRef.current) return;
    const last=(gcalMeta&&gcalMeta.lastSyncAt)||"";
    const dirty=(Array.isArray(gcalTomb)&&gcalTomb.length>0)||
      (Array.isArray(events)&&events.some(e=>e&&e.updatedAt&&(!last||e.updatedAt>last)));
    if(!dirty) return;
    const t=setTimeout(()=>{ if(gcalFnRef.current) gcalFnRef.current({silent:true}); },12000);
    return()=>clearTimeout(t);
  },[events,gcalTomb,gcalOn,user]);

  // Миграция: у старых шаблонов расписания не было даты начала, из-за чего они
  // «задним числом» начисляли уроки за прошлые недели. Проставляем им сегодня.
  // Идемпотентно: как только у всех шаблонов есть startDate, эффект ничего не делает.
  useEffect(()=>{
    if(Array.isArray(rls)&&rls.some(r=>r&&!r.startDate)){
      setRls(prev=>(Array.isArray(prev)?prev:[]).map(r=>(r&&!r.startDate)?{...r,startDate:today()}:r));
    }
  },[rls]);

  // Напоминание о резервной копии, если её давно не делали и данные есть.
  useEffect(()=>{
    try{
      const last=Number(localStorage.getItem("fhq_last_export")||0);
      const days=(Date.now()-last)/86400000;
      const hasData=(students&&students.length)||(events&&events.length);
      const isGoogle=user&&user.type==="google";
      if(hasData && !isGoogle && (!last || days>=7) && !document.getElementById("fhq-backup-nudge")){
        const bar=document.createElement("div");
        bar.id="fhq-backup-nudge";
        bar.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;background:#1C1C1E;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);font-size:13px;z-index:9998;display:flex;gap:12px;align-items:center;justify-content:space-between";
        const txt=document.createElement("span");
        txt.textContent=last?"Давно не делали резервную копию. Сохраните данные на всякий случай.":"Совет: сохраните резервную копию данных — на случай очистки браузера.";
        const wrap=document.createElement("div");wrap.style.cssText="display:flex;gap:8px;flex-shrink:0";
        const b1=document.createElement("button");b1.textContent="Экспорт";b1.style.cssText="padding:6px 12px;border-radius:8px;border:none;background:#2C5EE8;color:#fff;font-weight:600;cursor:pointer;font-size:12px";
        b1.onclick=()=>{ try{ expData(); }catch{} };
        const b2=document.createElement("button");b2.textContent="Позже";b2.style.cssText="padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer;font-size:12px";
        b2.onclick=()=>bar.remove();
        wrap.appendChild(b1);wrap.appendChild(b2);bar.appendChild(txt);bar.appendChild(wrap);
        document.body.appendChild(bar);
      }
    }catch{}
  },[students,events,user]);

  const store={events,setEvents,students,setStudents,expenses,setExpenses,incomes,setIncomes,
    tasks,setTasks,ideas,setIdeas,projects,setProjects,goals,setGoals,journal,setJournal,
    kb,setKb,offline,setOffline,payments,setPayments,rls,setRls,excs,setExcs,brain,setBrain,expTpl,setExpTpl,lessonLog,setLessonLog,quickLog,setQuickLog,homeTiles,setHomeTiles,pageStyles,setPageStyles,autoComplete,pushUndo,pushTomb,dropTomb};

  const overdueCount=tasks.filter(t=>t.status!=="done"&&t.deadline&&t.deadline<today()).length;
  const pendPayCount=useMemo(()=>{
    const mStr=localYM(new Date());
    return students.filter(s=>{
      const ch=events.filter(e=>e.studentId===s.id&&e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length*(Number(s.price)||0);
      const pd=payments.filter(p=>p.studentId===s.id&&p.date?.startsWith(mStr)&&p.status!=="cancelled").reduce((a,p)=>a+(Number(p.amount)||0),0);
      return ch-pd>0;
    }).length;
  },[students,events,payments]);

  const NAV=[
    {g:"",items:[
      {id:"home",icon:"◻",label:"Главная"},
      {id:"week",icon:"◫",label:"Моя неделя"},
    ]},
    {g:"Работа",items:[
      {id:"calendar",icon:"▦",label:"Календарь"},
      {id:"schedule",icon:"↻",label:"Расписание"},
      {id:"students",icon:"◉",label:"Ученики"},
    ]},
    {g:"Финансы",items:[
      {id:"finance",icon:"◈",label:"Финансы"},
      {id:"payments",icon:"◇",label:"Платежи",badge:pendPayCount},
    ]},
    {g:"Задачи",items:[
      {id:"tasks",icon:"◻",label:"Задачи",badge:overdueCount},
      {id:"projects",icon:"◆",label:"Проекты"},
    ]},
    {g:"База знаний",items:[
      {id:"brain",icon:"◎",label:"Второй мозг"},
      {id:"kb",icon:"▣",label:"База знаний"},
      {id:"journal",icon:"◑",label:"Журнал"},
    ]},
    {g:"Итоги",items:[
      {id:"stats",icon:"▲",label:"Аналитика"},
      {id:"goals",icon:"◌",label:"Цели"},
    ]},
  ];

  const ALLNAV=[
    {id:"home",icon:"⬡",label:"Сводка"},
    {id:"calendar",icon:"▦",label:"Календарь"},
    {id:"students",icon:"◉",label:"Ученики"},
    {id:"payments",icon:"◇",label:"Платежи",badge:pendPayCount},
    {id:"finance",icon:"◈",label:"Финансы"},
    {id:"week",icon:"◫",label:"Моя неделя"},
    {id:"schedule",icon:"↻",label:"Расписание"},
    {id:"tasks",icon:"✓",label:"Задачи",badge:overdueCount},
    {id:"projects",icon:"◆",label:"Проекты"},
    {id:"brain",icon:"✦",label:"Заметки"},
    {id:"kb",icon:"❑",label:"База знаний"},
    {id:"stats",icon:"▲",label:"Аналитика"},
    {id:"goals",icon:"◎",label:"Цели"},
  ];
  const defaultOrder=["home","calendar","students","payments","finance","week","schedule","tasks","projects","brain","kb","stats","goals"];
  const order=(Array.isArray(dockOrder)&&dockOrder.length?dockOrder:defaultOrder)
    .filter(id=>ALLNAV.some(n=>n.id===id));
  ALLNAV.forEach(n=>{if(!order.includes(n.id))order.push(n.id);});
  const navById=id=>ALLNAV.find(n=>n.id===id);
  const DOCK=order.slice(0,5).map(navById);
  const MORE=order.slice(5).map(navById);

  const PAGES={
    home:<Home store={store} setTab={setTab}/>,
    week:<WeekView store={store}/>,
    calendar:<CalPage store={store} openNew={calModal} onOpenNew={()=>setCalModal(false)}/>,
    schedule:<RecurringPage store={store}/>,
    students:<StudentsPage store={store}/>,
    finance:<FinancePage store={store}/>,
    payments:<PaymentsPage store={store}/>,
    tasks:<TasksPage store={store}/>,
    projects:<ProjectsPage store={store}/>,
    brain:<BrainPage store={store}/>,
    kb:<KBPage store={store}/>,
    journal:<JournalPage store={store}/>,
    stats:<StatsPage store={store}/>,
    goals:<GoalsPage store={store}/>,
  };

  const now=new Date();

  if(user===undefined&&GDRIVE_CLIENT_ID!=="YOUR_GOOGLE_CLIENT_ID") {
    return <AuthScreen onAuth={u=>{
      if(u===null){
        localStorage.setItem("fhq_gdrive_choice","local");
        setUser(null);
      } else {
        localStorage.setItem("fhq_gdrive_choice","google");
        localStorage.setItem("fhq_gdrive_token",u.token);
        gToken=u.token;
        setUser(u);
      }
    }}/>;
  }

  return(
    <div style={{display:"flex",height:"100vh",overflow:"hidden",background:T.bg}}>
      {/* Sidebar — desktop only */}
      <div className="desktop-sidebar" style={{
        width:220,background:"var(--sidebar-bg)",
        display:"flex",flexDirection:"column",flexShrink:0,
        overflowY:"auto",borderRight:"none"
      }}>
        <div style={{padding:"20px 18px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{
            width:32,height:32,
            background:"linear-gradient(135deg,#2563EB,#7C3AED)",
            borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:13,fontWeight:800,color:"#fff",letterSpacing:"-0.02em",flexShrink:0,
            boxShadow:"0 4px 16px rgba(44,94,232,0.4)"
          }}>F</div>

                if(!window.confirm("Сбросить состояние синхронизации?\n\nСледующая синхронизация пройдёт заново с нуля. События нигде не удаляются, но могут появиться дубликаты, если они были удалены вручную."))return;
                setGcalMeta({});setGcalRecMap({});setGcalSkip([]);setGcalTomb([]);
                alert("Состояние сброшено. Нажмите «Синхронизировать».");
              }}>↺ Сбросить состояние</Btn>
            </div>

            <div style={{fontSize:10.5,color:T.t3,marginTop:8,lineHeight:1.45}}>
              {gcalMeta&&gcalMeta.lastError
                ? <span style={{color:T.red}}>Последняя ошибка: {gcalMeta.lastError}</span>
                : (gcalMeta&&gcalMeta.lastSyncAt
                    ? <>Последняя синхронизация: {new Date(gcalMeta.lastSyncAt).toLocaleString("ru-RU")}{gcalMeta.lastResult?<><br/>{gcalMeta.lastResult}</>:null}</>
                    : "Синхронизация ещё не выполнялась.")}
            </div>

            <div style={{fontSize:10.5,color:T.t3,marginTop:8,lineHeight:1.45}}>
              Окно синхронизации — 14 дней назад и 60 вперёд. Уроки из шаблонов расписания создаются в календаре; если удалить такой урок в Google, заново он не создастся. Предохранитель: если в Google за раз удалено больше 25 событий, синхронизация останавливается и ничего не удаляет. Нужен включённый Calendar API — инструкция в README.
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
              <Btn variant="secondary" size="sm" onClick={()=>{gCalAuth(true).then(()=>pushWeekToGCal()).catch(e=>alert("Ошибка доступа к календарю: "+(e&&e.message||e)));}}>↑ Только неделю</Btn>
              <Btn variant="secondary" size="sm" onClick={()=>{gCalAuth(true).then(()=>pullFromGCal()).catch(e=>alert("Ошибка доступа к календарю: "+(e&&e.message||e)));}}>↓ Только загрузить</Btn>
            </div>
            <div style={{fontSize:10.5,color:T.t3,marginTop:6,lineHeight:1.4}}>Ручной режим без автосинхронизации — только добавление, ничего не удаляется.</div>
          </div>

          <div>
            <div style={{fontSize:11,fontWeight:800,color:T.t3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Отчёты и выгрузка</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <Btn variant="secondary" size="sm" onClick={()=>{exportPDF();}}>📄 Сводка PDF</Btn>
              <Btn variant="secondary" size="sm" onClick={()=>{exportExcel();}}>📊 Excel (.xls)</Btn>
            </div>
            <div style={{fontSize:10.5,color:T.t3,marginTop:6,lineHeight:1.4}}>PDF — расписание недели + ученики + финансы. Excel — таблицы учеников, занятий и финансов.</div>
          </div>
        </Modal>
      )}
      {quickLog&&<QuickLogModal store={store} onClose={()=>setQuickLog(null)}/>}
    </div>
  );
}

/* ── ГРАНИЦА ОШИБОК ────────────────────────────────────────────
   Ловит краши рендера: вместо белого экрана — экран с кнопками
   «скачать резервную копию» (читает прямо из localStorage) и
   «перезагрузить». Данные не теряются. */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error("App crashed:",err,info); }
  rescue(){
    try{
      const keys=["lhq_events","lhq_students","lhq_expenses","lhq_incomes","lhq_tasks","lhq_ideas","lhq_projects","lhq_goals","lhq_journal","lhq_kb","lhq_offline","lhq_payments","lhq_recurring","lhq_exceptions","lhq_brain","lhq_exptpl","lhq_lessonlog","fhq_dockorder","fhq_hometiles","fhq_pagestyles"];
      const d={_exported:new Date().toISOString(),_rescue:true};
      keys.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!=null) d[k.replace(/^lhq_|^fhq_/,"")]=JSON.parse(v); }catch{} });
      const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(b);
      a.download="fizmat_rescue_"+new Date().toISOString().slice(0,10)+".json"; a.click();
    }catch(e){ alert("Не удалось выгрузить: "+(e&&e.message||e)); }
  }
  render(){
    if(this.state.err){
      const E=React.createElement;
      return E("div",{style:{padding:"32px 20px",maxWidth:520,margin:"40px auto",fontFamily:"Inter,-apple-system,sans-serif",color:"#1C1C1E"}},
        E("h2",{style:{fontSize:20,margin:"0 0 8px"}},"Что-то сломалось"),
        E("p",{style:{color:"#636366",fontSize:14,margin:"0 0 20px",lineHeight:1.5}},"Приложение столкнулось с ошибкой. Данные в безопасности — скачайте резервную копию, затем перезагрузите."),
        E("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
          E("button",{onClick:()=>this.rescue(),style:{padding:"10px 18px",borderRadius:9,border:"none",background:"#2C5EE8",color:"#fff",fontWeight:600,cursor:"pointer",fontSize:14}},"⬇ Скачать резервную копию"),
          E("button",{onClick:()=>location.reload(),style:{padding:"10px 18px",borderRadius:9,border:"1px solid rgba(0,0,0,0.1)",background:"#fff",color:"#1C1C1E",fontWeight:600,cursor:"pointer",fontSize:14}},"↻ Перезагрузить")
        ),
        E("pre",{style:{marginTop:20,padding:12,background:"#FAF9F7",borderRadius:8,fontSize:11,color:"#8E8E93",whiteSpace:"pre-wrap",maxHeight:160,overflow:"auto"}},String((this.state.err&&this.state.err.stack)||this.state.err))
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);</script>
